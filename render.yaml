services:
  - type: web
    name: facemash
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REACT_APP_ADMIN_SECRET_PATH
        value: admin-secret-upload
